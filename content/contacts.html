<main id="main" class="shell article-shell">
  <header class="page-heading contacts-heading">
    <h1>Contacts</h1>
    <p class="standfirst">Write to the Society about editorial enquiries, fieldwork or contributing a photographic or written record.</p>
  </header>
  <section class="contact-layout" aria-label="Contact the Society">
    <div class="contact-address"><h2 class="eyebrow">Email</h2><a href="mailto:thefieldwitnesssociety@gmail.com">thefieldwitnesssociety<wbr>@gmail.com</a></div>
    <div class="contact-content">
      <form class="contact-form" action="https://formsubmit.co/thefieldwitnesssociety@gmail.com" method="POST" aria-label="Contact the Society" aria-describedby="contact-guidance">
        <input type="hidden" name="_subject" value="New enquiry — The Field Witness Society">
        <input type="hidden" name="_next" value="https://fieldwitnesssociety.com/contact/thank-you/">
        <input type="hidden" name="_template" value="table">
        <input class="form-honeypot" type="text" name="_honey" tabindex="-1" autocomplete="off" aria-hidden="true">
        <p class="form-guidance" id="contact-guidance">All fields are required.</p>
        <div class="form-row">
          <div class="form-field"><label for="contact-name">Name</label><input id="contact-name" name="name" type="text" autocomplete="name" maxlength="120" required></div>
          <div class="form-field"><label for="contact-email">Email</label><input id="contact-email" name="email" type="email" autocomplete="email" maxlength="254" required></div>
        </div>
        <div class="form-field"><label for="contact-message">Message</label><textarea id="contact-message" name="message" rows="6" maxlength="10000" required></textarea></div>
        <div class="form-actions"><button class="submit-button" type="submit">Send message<span aria-hidden="true">→</span></button><p class="form-note">Email delivery by <a href="https://formsubmit.co/privacy.pdf">FormSubmit</a>.</p></div>
      </form>
    </div>
  </section>
</main>
